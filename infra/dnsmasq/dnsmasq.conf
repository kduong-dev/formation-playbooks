# Bind only to LAN interface, not loopback
bind-interfaces
interface=wlp0s20f3

# Upstream DNS
server=1.1.1.1
server=8.8.8.8

# Local hostnames
# Every formation-playbooks project lives under .home (infra/gateway).
address=/home/192.168.1.19

# Don't read /etc/hosts
no-hosts

# Don't forward .local queries upstream
local=/local/
