---
- name: "[{{ service_name }}] Reset env (container mode)"
  set_fact:
    service_environment: {}

- name: "[{{ service_name }}] Merge container resources"
  set_fact:
    service_environment: "{{ service_environment | combine(lookup('vars', item.0.key)[item.1]) }}"
  loop: "{{ resources | dict2items | subelements('value') }}"
  loop_control:
    label: "{{ item.0.key }}.{{ item.1 }}"
  vars:
    mode: container

- name: "[{{ service_name }}] Ensure .env directory exists"
  file:
    path: "{{ env_dest | dirname }}"
    state: directory
    mode: '0755'

- name: "[{{ service_name }}] Render .env"
  template:
    src: "{{ playbook_dir }}/templates/service.env.j2"
    dest: "{{ env_dest }}"
    mode: '0600'
