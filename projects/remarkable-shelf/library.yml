---
secrets:
  remarkable_ssh:
    SSH_USER: "{{ remarkable_ssh_user | default('root') }}"
    SSH_PORT: "{{ remarkable_ssh_port | default('22') }}"
  # The raw storage-service key for the remarkable-shelf namespace; its hash
  # is registered in projects/storage-service's storage_clients_b64_json.
  storage_service_api_key:
    STORAGE_SERVICE_API_KEY: "{{ storage_service_api_key }}"

config:
  server:
    PORT: "{{ services.server.container.port }}"
  folder_source:
    PORT: "{{ services.folder_source.container.port }}"
    FOLDER_SOURCE_DIR: /books
    FOLDER_SOURCE_NAME: "{{ books_folder.name }}"

# The server keeps book files in storage-service, reached over the shared
# `storage` docker network.
clients:
  storage_service:
    STORAGE_SERVICE_CLIENT_IMPLEMENTATION: HTTP
    STORAGE_SERVICE_URL: "{{ storage_service.url }}"
