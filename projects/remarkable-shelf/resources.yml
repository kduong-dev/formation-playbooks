---
db:
  sqlite:
    path: /app/data/remarkable-shelf.db

named_volumes:
  - remarkable-shelf-db

stores:
  sqlite:
    DB_PATH: "{{ db.sqlite.path }}"

# Runs as its own formation (projects/storage-service). Containers reach it over
# the shared `storage` network.
storage_service:
  url: "http://storage-service:8083"

# The host folder folder-source serves, mounted read-only. Drop EPUBs and
# PDFs in it, named after their books; subfolders are searched too.
books_folder:
  host_path: /opt/remarkable-shelf/books
  name: Bookshelf folder
