---
# All external access goes through the shared Traefik (infra/gateway) on :80.
# Server names live under .home, which the server's dnsmasq answers for as a
# whole (see infra/gateway/README.md), so no hosts-file entries.
domain: remarkable-shelf.home

# Local dev — resolves natively in all browsers, no hosts file needed.
local_domain: remarkable-shelf.localhost

# No api_domain / local_api_domain: the frontend calls its API by relative
# path (/api/...), so the server is routed on the frontend's domains.

services:
  # The YAML key (underscored) maps to a docker-compose service name and a
  # ../reMarkableShelf/backend/cmd/<dir> by replacing _ with -. The path_prefix
  # must match the API's mux route prefix.
  server:
    resources:
      secrets: [remarkable_ssh, storage_service_api_key]
      config:  [server]
      stores:  [sqlite]
      clients: [storage_service]
    scheme: http
    path_prefix: /api
    container: { host: server, port: 8080 }
    compose:
      memory: { limit: 256m, reservation: 64m }
      volumes:
        - "remarkable-shelf-db:/app/data"
      # Keeps book files in storage-service, which runs as its own formation
      # (projects/storage-service).
      networks: [storage]

  # The example ebook source plugin (cmd/folder-source), serving the EPUBs
  # and PDFs in the host's books folder. It's internal, with no path_prefix:
  # only the server reaches it, as http://folder-source:8090, the URL to add
  # it under on the app's Sources page.
  folder_source:
    resources:
      config: [folder_source]
    scheme: http
    container: { host: folder-source, port: 8090 }
    compose:
      memory: { limit: 64m, reservation: 16m }
      volumes:
        - "{{ books_folder.host_path }}:/books:ro"

frontend:
  # Catch-all: everything not matched by a service path_prefix lands on the frontend.
  compose:
    container_port: 80
    memory: { limit: 128m, reservation: 32m }
    depends_on:
      - { name: server }
