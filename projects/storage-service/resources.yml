---
redis:
  address: redis:6379
  compose:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["redis-data:/data"]
    memory: { limit: 256m, reservation: 64m }

named_volumes:
  - redis-data

logs:
  storage_event_log:
    STORAGE_EVENT_LOG_FACTORY: REDIS
    STORAGE_EVENT_LOG_REDIS_ADDRESS: "{{ redis.address }}"

storage:
  filesystem:
    STORAGE: FILESYSTEM
    STORAGE_FILESYSTEM_DIRECTORY: /app/storage
