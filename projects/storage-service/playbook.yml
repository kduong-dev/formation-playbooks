---
- name: Generate service env files from encrypted secrets
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - secrets.yml
    - services.yml
    - resources.yml
    - library.yml

  vars:
    project: storage-service
    formation_root: "{{ playbook_dir }}/../.."
    # Go module, relative to formation-playbooks' parent (the build context).
    backend_dir: storage-service
    extra_compose_services: [redis]
    # Not browser-facing: callers reach it over the shared network, so there's
    # no frontend and no Traefik in this stack.
    traefik: false
    external_networks: [storage]

  tasks:
    # `apply` carries each tag into the included tasks, so e.g. `--tags <service>`
    # renders just that service; a tag on include_tasks alone doesn't reach them.
    - name: Generate storage-service .env
      include_tasks:
        file: ../../../storage-service/cmd/server/formation.yml
        apply:
          tags: [storage-service]
      tags:
        - storage-service

    - name: Render docker-compose.yml and Traefik routes
      import_tasks: "{{ formation_root }}/shared/tasks/render-compose.yml"
