---
# Routed by the shared Traefik (infra/gateway) on :80. The .home name
# resolves via the server's dnsmasq; the .localhost name resolves natively.
api_domain: api.storage-service.home
local_api_domain: api.storage-service.localhost

services:
  # The YAML key (underscored) maps to the docker-compose service name by
  # replacing _ with -; `cmd` names its ../storage-service/cmd/<dir>. Other
  # projects' containers reach it as storage-service:8083 (its container.host,
  # aliased on the shared `storage` network), anything else through the gateway; each authenticates with its own API key, which
  # maps to a namespace (see storage-service's cmd/api-key-generator).
  api:
    resources:
      secrets: [storage_clients]
      logs:    [storage_event_log]
      storage: [filesystem]
    scheme: http
    path_prefix: /storage/v1
    container: { host: storage-service, port: 8083 }
    cmd: server
    compose:
      memory: { limit: 256m, reservation: 64m }
      # Loopback only: for callers running on the host (another project's proxy mode).
      ports: ["127.0.0.1:8083:8083"]
      networks: [storage]
      depends_on:
        - { name: redis, condition: service_healthy }
      volumes:
        - "/opt/storage-service:/app/storage"
