---
redis:
  container: { address: redis:6379 }
  local:     { address: localhost:6379 }
  compose:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["redis-data:/data"]
    memory: { limit: 256m, reservation: 64m }

postgres:
  container: { dsn: "postgresql://postgres:postgres@postgres:5432/trading_auth?sslmode=disable" }
  local:     { dsn: "postgresql://postgres:postgres@localhost:5432/trading_auth?sslmode=disable" }
  compose:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trading_auth"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    memory: { limit: 512m, reservation: 128m }

named_volumes:
  - postgres-data
  - redis-data

logs:
  account_event_log:
    ACCOUNT_EVENT_LOG_FACTORY: REDIS
    ACCOUNT_EVENT_LOG_REDIS_ADDRESS: "{{ redis[mode].address }}"
  bot_event_log:
    TRADING_BOT_EVENT_LOG_FACTORY: REDIS
    TRADING_BOT_EVENT_LOG_REDIS_ADDRESS: "{{ redis[mode].address }}"
  reporting_event_log:
    TRADING_REPORT_EVENT_LOG_FACTORY: REDIS
    TRADING_REPORT_EVENT_LOG_REDIS_ADDRESS: "{{ redis[mode].address }}"
  journal_event_log:
    TRADING_JOURNAL_EVENT_LOG_FACTORY: REDIS
    TRADING_JOURNAL_EVENT_LOG_REDIS_ADDRESS: "{{ redis[mode].address }}"

stores:
  user_postgres:
    USER_STORE_IMPLEMENTATION: POSTGRES
    USER_STORE_POSTGRES_DATASOURCE_NAME: "{{ postgres[mode].dsn }}"

# Runs as its own formation (projects/storage-service). Containers reach it over
# the shared `storage` network; host-run services through its loopback port.
storage_service:
  container: { url: "http://storage-service:8083" }
  local:     { url: "http://localhost:8083" }
