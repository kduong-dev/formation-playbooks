---
- name: Generate service env files from encrypted secrets
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - secrets.yml
    - services.yml
    - resources.yml
    - library.yml

  vars:
    project: trading-core
    formation_root: "{{ playbook_dir }}/../.."
    # Backend Go module, relative to formation-playbooks' parent (the build context).
    backend_dir: trading-core/backend
    extra_compose_services: [redis, postgres]
    external_networks: [storage]
    frontend_env_file: true
    makefile_targets: []

  tasks:
    # `apply` carries each tag into the included tasks, so e.g. `--tags <service>`
    # renders just that service; a tag on include_tasks alone doesn't reach them.
    - name: Generate account-service .env
      include_tasks:
        file: backend/account-service/formation.yml
        apply:
          tags: [account-service]
      tags:
        - account-service

    - name: Generate stock-screener .env
      include_tasks:
        file: backend/stock-screener/formation.yml
        apply:
          tags: [stock-screener]
      tags:
        - stock-screener

    - name: Generate authentication-service .env
      include_tasks:
        file: backend/authentication-service/formation.yml
        apply:
          tags: [authentication-service]
      tags:
        - authentication-service

    - name: Generate bot-service .env
      include_tasks:
        file: backend/bot-service/formation.yml
        apply:
          tags: [bot-service]
      tags:
        - bot-service

    - name: Generate reporting-service .env
      include_tasks:
        file: backend/reporting-service/formation.yml
        apply:
          tags: [reporting-service]
      tags:
        - reporting-service

    - name: Generate journal-service .env
      include_tasks:
        file: backend/journal-service/formation.yml
        apply:
          tags: [journal-service]
      tags:
        - journal-service

    - name: Generate frontend .env
      include_tasks:
        file: frontend/formation.yml
        apply:
          tags: [frontend]
      tags:
        - frontend

    - name: Render proxy Makefile
      template:
        src: "{{ playbook_dir }}/templates/Makefile.j2"
        dest: ../../../trading-core/backend/Makefile
        mode: '0644'
      tags:
        - makefile

    - name: Render docker-compose.yml and Traefik routes
      import_tasks: "{{ formation_root }}/shared/tasks/render-compose.yml"
