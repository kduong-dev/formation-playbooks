---
- name: Generate service env files from encrypted secrets
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - secrets.yml
    - services.yml
    - resources.yml
    - library.yml

  vars:
    project: trading-core
    formation_root: "{{ playbook_dir }}/../.."
    # Backend Go module, relative to formation-playbooks' parent (the build context).
    backend_dir: trading-core/backend
    extra_compose_services: [redis, postgres]
    external_networks: [storage]
    frontend_env_file: true
    makefile_targets: []

  tasks:
    - name: Render service .env files
      import_tasks: "{{ formation_root }}/shared/tasks/render-services.yml"

    - name: Render frontend .env
      include_tasks: "{{ formation_root }}/shared/tasks/render-env.yml"
      vars:
        mode: local
        env_dest: frontend/.env
        resources: "{{ frontend.resources }}"

    - name: Render proxy Makefile
      template:
        src: "{{ playbook_dir }}/templates/Makefile.j2"
        dest: ../../../trading-core/backend/Makefile
        mode: '0644'
      tags:
        - makefile

    - name: Render docker-compose.yml and Traefik routes
      import_tasks: "{{ formation_root }}/shared/tasks/render-compose.yml"
