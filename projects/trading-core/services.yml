---
# All external access goes through the shared Traefik (infra/gateway) on :80.
# Server names live under .home, which the server's dnsmasq answers for as a
# whole (see infra/gateway/README.md), so no hosts-file entries.
domain: trading-core.home
api_domain: api.trading-core.home

# Local dev — resolves natively in all browsers, no hosts file needed.
local_domain: trading-core.localhost
local_api_domain: api.trading-core.localhost

# What rendered URLs use: the .localhost pair by default, the .local pair with
# `run-services.sh render --local`.
effective_domain: "{{ local_domain if (local_mode | default('')) == 'localhost' else domain }}"
effective_api_domain: "{{ local_api_domain if (local_mode | default('')) == 'localhost' else api_domain }}"


services:
  # The YAML key (underscored) maps to a docker-compose service name and a
  # trading-core/backend/cmd/<dir> by replacing _ with -. The path_prefix must match
  # the PathPrefix() declared in that service's httpapi/Handler.go.
  account_service:
    resources:
      secrets: [token, broker_credentials]
      logs:    [account_event_log]
      apis:    [trading_api, frontend]
    scheme: http
    path_prefix: /accounts/v1
    container: { host: account-service, port: 9000 }
    compose:
      memory: { limit: 256m, reservation: 64m }
      depends_on:
        - { name: redis, condition: service_healthy }

  stock_screener:
    resources:
      secrets: [token, alpaca]
      apis:    [alpaca, cnn_market_sentiment]
    scheme: http
    path_prefix: /stock-screener/v1
    container: { host: stock-screener, port: 8080 }
    compose:
      memory: { limit: 256m, reservation: 64m }

  authentication_service:
    resources:
      secrets: [token]
      stores:  [user_postgres]
    scheme: http
    path_prefix: /auth/v1
    container: { host: authentication-service, port: 9100 }
    compose:
      memory: { limit: 256m, reservation: 64m }
      depends_on:
        - { name: postgres, condition: service_healthy }

  bot_service:
    resources:
      secrets: [token, broker_credentials]
      logs:    [bot_event_log]
      clients: [account_service]
    scheme: http
    path_prefix: /bots/v1
    container: { host: bot-service, port: 8081 }
    compose:
      memory: { limit: 256m, reservation: 64m }
      depends_on:
        - { name: account-service }

  reporting_service:
    resources:
      secrets: [token, alpaca, storage_service_api_key]
      apis:    [alpaca]
      logs:    [reporting_event_log]
      clients: [storage_service]
    scheme: http
    path_prefix: /reports/v1
    container: { host: reporting-service, port: 8082 }
    compose:
      memory: { limit: 512m, reservation: 128m }
      depends_on:
        - { name: redis, condition: service_healthy }
      # Calls storage-service, which runs as its own formation (projects/storage-service).
      networks: [storage]

  journal_service:
    resources:
      secrets: [token]
      logs:    [journal_event_log]
    scheme: http
    path_prefix: /journal/v1
    container: { host: journal-service, port: 8084 }
    compose:
      memory: { limit: 256m, reservation: 64m }
      depends_on:
        - { name: redis, condition: service_healthy }

frontend:
  resources:
    public_clients: [account_service, stock_screener, authentication_service, bot_service, journal_service, reporting_service]
  # Catch-all: everything not matched by a service path_prefix lands on the frontend.
  compose:
    container_port: 3000
    memory: { limit: 512m, reservation: 128m }
    depends_on:
      - { name: account-service }
      - { name: stock-screener }
      - { name: authentication-service }
      - { name: bot-service }
      - { name: reporting-service }
      - { name: journal-service }
