---
# Container-mode .env for docker-compose, then the local-mode env as a
# sourceable host.env for running the service on the host (proxy mode).
- include_tasks: "{{ formation_root }}/shared/tasks/merge-env.yml"
  vars:
    mode: container

- include_tasks: "{{ formation_root }}/shared/tasks/write-env.yml"

- include_tasks: "{{ formation_root }}/shared/tasks/merge-env.yml"
  vars:
    mode: local

- name: "[{{ service_name }}] Render host.env"
  template:
    src: "{{ formation_root }}/shared/templates/host.env.j2"
    dest: "{{ env_dest | dirname }}/host.env"
    mode: '0600'
