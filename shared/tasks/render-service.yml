---
# Container-mode .env for docker-compose, then the local-mode env as a
# Makefile target for running the service on the host.
- include_tasks: "{{ formation_root }}/shared/tasks/merge-env.yml"
  vars:
    mode: container

- include_tasks: "{{ formation_root }}/shared/tasks/write-env.yml"

- include_tasks: "{{ formation_root }}/shared/tasks/merge-env.yml"
  vars:
    mode: local

- name: "[{{ service_name }}] Collect Makefile target"
  set_fact:
    makefile_targets: "{{ makefile_targets | default([]) + [{'name': service_name, 'repo_dir': repo_dir | default(''), 'cmd_dir': cmd_dir, 'env': service_environment}] }}"
