---
# docker-compose.yml into the project's own directory, and the project's
# routes into the shared Traefik's directory (projects/gateway/routes), which
# it watches, so re-rendering updates routing without restarting anything.
- name: Render docker-compose.yml
  template:
    src: "{{ formation_root }}/shared/templates/docker-compose.yml.j2"
    dest: "{{ playbook_dir }}/docker-compose.yml"
    mode: '0644'
  tags:
    - compose

- name: Ensure gateway routes dir exists
  file:
    path: "{{ formation_root }}/projects/gateway/routes"
    state: directory
    mode: '0755'
  tags:
    - traefik

- name: Render Traefik routes
  template:
    src: "{{ formation_root }}/shared/templates/traefik-static.yml.j2"
    dest: "{{ formation_root }}/projects/gateway/routes/{{ project }}.yml"
    mode: '0644'
  tags:
    - traefik
