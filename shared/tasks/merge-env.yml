---
# Builds service_environment from the caller's `resources` map
# ({library section: [entry, ...]}).
- name: "[{{ service_name | default(env_dest) }}] Reset env"
  set_fact:
    service_environment: {}

- name: "[{{ service_name | default(env_dest) }}] Merge resources"
  set_fact:
    service_environment: "{{ service_environment | combine(lookup('vars', item.0.key)[item.1]) }}"
  loop: "{{ resources | dict2items | subelements('value') }}"
  loop_control:
    label: "{{ item.0.key }}.{{ item.1 }}"
